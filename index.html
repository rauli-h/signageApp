<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Instructions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Hide scrollbars */
        }
        /* Style for the horizontal lines between lanes */
        .lane-divider {
            border-bottom: 4px solid white;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">

    <!-- Main container for the digital sign -->
    <div id="signage-display" class="bg-blue-800 text-white w-full max-w-4xl p-8 rounded-lg shadow-2xl flex items-center justify-between">

        <!-- Left section for text content -->
        <div class="flex flex-col justify-between h-full space-y-4">
            <div>
                <p class="text-4xl md:text-5xl font-light">Tervetuloa</p>
                <p id="license-plate" class="text-7xl md:text-9xl font-bold my-4">ABC-123</p>
            </div>
            <div>
                <p class="text-3xl md:text-4xl font-light">Valitse lyhin</p>
                <p id="lane-info" class="text-3xl md:text-4xl font-light">jono 2-5</p>
            </div>
        </div>

        <!-- Right section for lane indicators -->
        <div id="lanes-container" class="flex flex-col text-6xl md:text-7xl font-bold space-y-2">
            <!-- Lane indicators will be dynamically inserted here by JavaScript -->
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);

            // --- Get URL Parameters or use Defaults ---
            const plateParam = urlParams.get('plate') || 'ABC-123';
            const lanesParam = urlParams.get('lanes'); // e.g., "2,3,5"

            // Default to lanes 2,3,4,5 if no parameter is provided
            const availableLanes = lanesParam ? lanesParam.split(',').map(Number) : [2, 3, 4, 5];

            // --- Update UI Elements ---
            const licensePlateElement = document.getElementById('license-plate');
            const laneInfoElement = document.getElementById('lane-info');
            const lanesContainer = document.getElementById('lanes-container');

            // Update license plate text
            licensePlateElement.textContent = plateParam;

            // Update available lanes text
            if (availableLanes.length > 0) {
                 const minLane = Math.min(...availableLanes);
                 const maxLane = Math.max(...availableLanes);
                 laneInfoElement.textContent = `jono ${minLane}-${maxLane}`;
            } else {
                 laneInfoElement.textContent = 'Kaikki jonot suljettu'; // All lanes closed
            }


            // --- Generate Lane Indicators ---
            lanesContainer.innerHTML = ''; // Clear any existing content
            for (let i = 5; i >= 1; i--) {
                const isLaneOpen = availableLanes.includes(i);

                const laneElement = document.createElement('div');
                laneElement.className = 'flex items-center justify-end space-x-6';

                // Add divider line, but not for the last item
                if (i > 1) {
                    laneElement.classList.add('lane-divider', 'pb-2');
                }
                 if (i < 5) {
                    laneElement.classList.add('pt-2');
                }


                const laneNumber = document.createElement('span');
                laneNumber.textContent = i;
                laneElement.appendChild(laneNumber);

                const laneIcon = document.createElement('span');
                if (isLaneOpen) {
                    // Green Arrow
                    laneIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>`;
                    laneIcon.className = 'text-green-400';
                } else {
                    // Red X
                    laneIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>`;
                    laneIcon.className = 'text-red-500';
                }
                laneElement.appendChild(laneIcon);
                lanesContainer.appendChild(laneElement);
            }
        });
    </script>
</body>
</html>
